<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>HT Classifieds</title>


    <!-- bootstrap css -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">


    <!-- custom css -->
    <link
        rel="stylesheet"
        href="./css/style.css">


    <!-- open Sans -->
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">


    <!-- bootstrap icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">



        <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous">
</script>
</head>
<body>
<div class="container-fluid page p-0">
    <header class="row align-items-center header m-0">
        <!--logo-->
        <div class="col">
            <img
                src="assets/logo.png"
                alt="HT Classifieds"
                class="logo">
        </div>


        <!-- right side  header -->
        <div class="col">


            <!-- top information -->
            <div class="d-flex justify-content-end align-items-center top gap-2">

                <a href="tel:01204030403">

                    <i class="bi bi-telephone-fill"></i>

                    0120-4030403
                </a>

                <span>|</span>


                <!-- translator -->
                <a href="#translator">

                    <i class="bi bi-translate"></i>

                    हिंदी

                </a>


                <span>|</span>


                <!-- login -->
                <a href="#login">

                    <i class="bi bi-person-circle"></i>

                    Login

                </a>


                <span>|</span>


                <!-- sign-up -->
                <a href="#signup">

                    Sign Up

                </a>

            </div>


            <!-- nav-bar -->
            <nav class="d-flex justify-content-end align-items-center flex-wrap gap-3">

                <a href="#matrimonial">
                    Matrimonial
                </a>

                <a href="#property">
                    Property
                </a>

                <a href="#rental">
                    Rental
                </a>

                <a href="#employment">
                    Employment
                </a>

                <a href="#automobiles">
                    Automobiles
                </a>

                <a href="#business">
                    Business
                </a>

                <a href="#obituary">
                    Obituary
                </a>

                <a href="#change">
                    Change Of Name
                </a>


                <!-- bootstrap dropdown -->

                <div class="dropdown">

                    <button
                        class="btn dropdown-toggle p-0"
                        type="button"
                        data-bs-toggle="dropdown"
                        aria-expanded="false">

                        Other Categories

                    </button>


                    <ul class="dropdown-menu">

                        <li>
                            <a class="dropdown-item"
                                href="#education">
                                Education
                            </a>
                        </li>

                        <li>
                            <a class="dropdown-item"
                                href="#retail">
                                Retail
                            </a>
                        </li>

                        <li>
                            <a class="dropdown-item"
                                href="#electronics">
                                Electronics
                            </a>
                        </li>

                        <li>
                            <a class="dropdown-item"
                                href="#greetings">
                                Greetings
                            </a>
                        </li>

                        <li>
                            <a class="dropdown-item"
                                href="#notices">
                                Notices
                            </a>
                        </li>

                        <li>
                            <a class="dropdown-item"
                                href="#unforgettable">
                                Unforgettable
                            </a>
                        </li>

                    </ul>

                </div>

            </nav>

        </div>

    </header>


    <!-- cards -->

    <main class="row">


        <!-- matrimonial -->

        <div class="col-lg-4 col-md-4 col-12">

            <div class="card-box">

                <a href="#matrimonial">

                    <img
                        src="assets/matrimonial.jpg"
                        alt="Matrimonial">

                    <span>
                        2 Lacks ads Booked
                    </span>

                    <b>
                        Matrimonial
                    </b>

                </a>

            </div>

        </div>


        <!-- employment -->

        <div class="col-lg-4 col-md-4 col-12">

            <div class="card-box">

                <a href="#employment">

                    <img
                        src="assets/employment.jpg"
                        alt="Employment">

                    <span>
                        1 Lac+ ads Booked
                    </span>

                    <b>
                        Employment
                    </b>

                </a>

            </div>

        </div>


        <!-- property -->

        <div class="col-lg-4 col-md-4 col-12">

            <div class="card-box">

                <a href="#property">

                    <img
                        src="assets/property.jpg"
                        alt="Property">

                    <span>
                        1.5 Lac+ ads Booked
                    </span>

                    <b>
                        Property
                    </b>

                </a>

            </div>

        </div>


    </main>

</div>
</body>

</html>
